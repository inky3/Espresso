<script id="vs" type="x-shader">#version 300 es
precision highp float;
in vec2 aP;
uniform sampler2D uW;
uniform vec4 uCam;
uniform float uYaw,uPitch,uRoll,uBreath,uBodyX,uBodyY,uSwayL,uSwayR,uJaw,uWide;
out vec2 vP;
const vec2 E=vec2(.76,-.65), D=vec2(.65,.76), PIV=vec2(682.,612.), HC=vec2(622.,470.);
void main(){
  vec2 p=aP; vP=aP;
  vec3 w=texture(uW,(aP-vec2(0.,140.))/vec2(1104.,860.)).rgb;
  float t=smoothstep(1020.,700.,p.y)*smoothstep(470.,600.,p.x)*smoothstep(1104.,980.,p.x);
  p.y-=(uBreath*3.6+uBodyY*3.0)*t; p.x+=uBodyX*3.*t;
  vec2 q=p-PIV; float a=uRoll*w.r; float c=cos(a),s=sin(a);
  p=PIV+vec2(c*q.x-s*q.y,s*q.x+c*q.y);
  vec2 h=aP-HC; float b=clamp(1.-dot(h,h)/(175.*175.),0.,1.);
  vec2 dir=E*uYaw+D*uPitch;
  p+=dir*(2.+b*4.)*w.r;
  vec2 ch=aP-vec2(668.,568.);
  p+=D*uJaw*1.5*exp(-dot(ch,ch)/1400.);
  vec2 e1=aP-vec2(663.,435.), e2=aP-vec2(578.,518.);
  p+=(e1*exp(-dot(e1,e1)/900.)+e2*exp(-dot(e2,e2)/760.))*uWide*.06*w.r;
  p.x+=uSwayL*w.g*15.; p.y+=abs(uSwayL)*w.g*2.;
  p.x+=uSwayR*w.b*13.; p.y+=abs(uSwayR)*w.b*2.;
  gl_Position=vec4((p.x-uCam.x)/uCam.z,-(p.y-uCam.y)/uCam.w,0.,1.);
}

<script id="fs" type="x-shader">#version 300 es

const vec4 EYE=vec4(530.,395.,170.,155.);

void main(){
  vec2 p=vP, s=p;
  vec2 d=p-MC; float u=dot(d,MA), v=dot(d,MN);

const MOODS={
  none:mood({}),
  smile:mood({smile:1,blush:.22,lid:.12,roll:-.025}),
  happy:mood({smile:1.15,blush:.4,roll:-.05,pitch:-.12}),
  curious:mood({smile:.15,wide:.45,roll:.07,pitch:-.12,mouth:.1,narrow:.6,gx:.1,gy:-.1}),
  thinking:mood({smile:-.15,lid:.08,roll:.05,pitch:-.45,gx:.65,gy:-.75}),
  surprised:mood({wide:1,mouth:.25,narrow:.85,pitch:-.3,roll:.02}),
  concerned:mood({smile:-.55,lid:.1,wide:.15,roll:.05,pitch:.28,gy:.1}),
  embarrassed:mood({smile:.45,blush:1,lid:.26,roll:-.045,pitch:.5,gx:-.7,gy:.6}),
  annoyed:mood({smile:-.75,lid:.36,roll:.03,pitch:.12,gx:-.85,gy:.05}),
  sleepy:mood({smile:.15,lid:.6,roll:-.075,pitch:.35,gy:.35,mouth:.05}),
  wink:mood({smile:1,blush:.2,roll:-.05})
};
const rig={count:0,yaw:0,pitch:0,roll:0,gx:0,gy:0,smile:0,blush:0,lid:0,happy:0,wide:0,narrow:0,mouth:0,glint:0,mood:'none',moodUntil:0,talking:false,
  blinkT:2,blinkP:-1,syl:0,sylT:0,sylNext:0,beat:0,beatT:0,beatNext:0,nod:0,wink:0,sL:0,vL:0,sR:0,vR:0,tYaw:0,tPitch:0,lastPtr:-1e9,lookAt:0,lyaw:0,lpitch:0,bump:0,ovBlink:null,nextSmile:performance.now()+6000};
function setMood(m,ms){rig.mood=m;rig.moodUntil=ms===Infinity?Infinity:performance.now()+(ms||2600);if(m==='wink')rig.wink=.62}
function frame(now){
  const t=now/1000,dt=Math.min((now-(frame.p||now))/1000,.05);frame.p=now;
  if(rig.mood!=='none'&&now>rig.moodUntil)setMood('none',Infinity);
  if(now>rig.nextSmile){if(rig.mood==='none')setMood('smile',rnd(2200,4200));rig.nextSmile=now+rnd(9000,18000)}
  const M=MOODS[rig.mood];
  if(now-rig.lastPtr>3000&&now>rig.lookAt){rig.tYaw=rnd(-.5,.5);rig.tPitch=rnd(-.3,.35);rig.lookAt=now+rnd(1800,4600)}
  const py=rig.yaw,pp=rig.pitch;
  rig.yaw=damp(rig.yaw,rig.tYaw*.9,5,dt);rig.pitch=damp(rig.pitch,clamp(rig.tPitch+M.pitch,-1,1),5,dt);
  rig.roll=damp(rig.roll,M.roll+rig.yaw*-.018,4.5,dt);rig.bump=damp(rig.bump,0,6,dt);
  const lookX=clamp(rig.tYaw+M.gx,-1,1),lookY=clamp(rig.tPitch+M.gy,-1,1);
  rig.gx=damp(rig.gx,lookX,16,dt);rig.gy=damp(rig.gy,lookY,16,dt);
  rig.smile=damp(rig.smile,M.smile,7,dt);rig.blush=damp(rig.blush,M.blush,4,dt);rig.lid=0;rig.happy=damp(rig.happy,M.happy,12,dt);rig.wide=damp(rig.wide,M.wide,10,dt);rig.narrow=damp(rig.narrow,M.narrow,10,dt);rig.glint=damp(rig.glint,rig.yaw*.8+rig.pitch*.5+Math.sin(t*.37)*.12,6,dt);
  /* blink */
  rig.blinkT-=dt;if(rig.blinkT<=0&&rig.blinkP<0){rig.blinkP=0;rig.blinkT=rig.mood==='sleepy'?rnd(1.6,3):Math.random()<.18?.22:rnd(2.4,5.6)}
  let bl=0;if(rig.blinkP>=0){rig.blinkP+=dt/(rig.mood==='sleepy'?.42:.17);const x=rig.blinkP;bl=x<.42?x/.42:x<.55?1:Math.max(0,1-(x-.55)/.45);if(x>=1)rig.blinkP=-1}
  if(rig.wink>0)rig.wink-=dt;
  const wk=rig.wink>0?Math.min(1,Math.min(rig.wink/.09,(.62-rig.wink)/.09)):0;
  /* physics: head speed drives the hair */
  const hv=((rig.yaw-py)+(rig.pitch-pp)*.4)/(dt||.016), k=38,c=4.2;
  const wind=Math.sin(t*.9)*.12+Math.sin(t*2.13+1)*.05;
  rig.vL+=(-k*rig.sL-c*rig.vL-hv*3.2+wind*k*.55*calm)*dt;rig.sL=clamp(rig.sL+rig.vL*dt,-1.1,1.1);
  rig.vR+=(-(k*.7)*rig.sR-c*rig.vR-hv*2.7+Math.sin(t*.74+2)*k*.05*calm)*dt;rig.sR=clamp(rig.sR+rig.vR*dt,-1.1,1.1);
  /* talking */
  if(rig.talking){
    /* syllables: irregular open/close, occasional short pauses */
    if(now>rig.sylNext){rig.sylT=rig.sylT>.08||Math.random()<.12?rnd(0,.05):rnd(.18,.42);rig.sylNext=now+rnd(85,170)+(Math.random()<.08?rnd(180,360):0)}
    /* emphasis beats: a small nod/lean every so often */
    if(now>rig.beatNext){rig.beatT=Math.random()<.6?rnd(.4,1):0;rig.beatNext=now+rnd(450,1100)}
  }else{rig.sylT=0;rig.beatT=0}
  rig.syl=damp(rig.syl,rig.sylT,22,dt);rig.beat=damp(rig.beat,rig.beatT,5,dt);
  rig.nod=damp(rig.nod,rig.beat,7,dt);
  rig.mouth=damp(rig.mouth,Math.max(M.mouth,rig.syl),26,dt);
  const breath=(Math.sin(t*(rig.mood==='sleepy'?1:1.55))*.5+.5)*calm;
  const idleY=(Math.sin(t*.53)*.05+Math.sin(t*.29+2)*.025)*calm,idleP=(Math.sin(t*.71+1)*.035+rig.nod*.11)*calm,idleR=(Math.sin(t*.43)*.012+rig.nod*.01)*calm;
  if(rig.count){
    gl.uniform1f(U.uYaw,rig.yaw+idleY);gl.uniform1f(U.uPitch,rig.pitch+idleP);gl.uniform1f(U.uRoll,(rig.roll+idleR+rig.bump)*.55);
    gl.uniform1f(U.uBreath,breath);gl.uniform1f(U.uBodyX,rig.yaw*.8);
    gl.uniform1f(U.uBodyY,rig.nod*calm);gl.uniform1f(U.uSwayL,rig.sL);gl.uniform1f(U.uSwayR,rig.sR);gl.uniform1f(U.uJaw,rig.mouth);
    gl.uniform2f(U.uGaze,.76*rig.gx*4.4+.65*rig.gy*3.2,-.65*rig.gx*4.4+.76*rig.gy*3.2);
    const L=rig.ovBlink!==null?rig.ovBlink:Math.max(bl,rig.lid),R=rig.ovBlink!==null?rig.ovBlink:Math.max(bl,rig.lid,wk);
    gl.uniform1f(U.uBlinkL,L);gl.uniform1f(U.uBlinkR,R);gl.uniform1f(U.uMouth,rig.mouth);gl.uniform1f(U.uSmile,rig.smile);gl.uniform1f(U.uBlush,rig.blush);
    gl.uniform1f(U.uHappy,rig.happy);gl.uniform1f(U.uWide,rig.wide);gl.uniform1f(U.uNarrow,rig.narrow);gl.uniform1f(U.uGlint,rig.glint);
    gl.uniform1f(U.uLamp,.75+.25*Math.sin(t*.8)+.07*Math.sin(t*5.7));
    gl.clear(gl.COLOR_BUFFER_BIT);gl.drawElements(gl.TRIANGLES,rig.count,gl.UNSIGNED_SHORT,0);
  }
  requestAnimationFrame(frame);
}
function ptr(e){const r=stage.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect();rig.tYaw=clamp((e.clientX-r.left-r.width*.5)/(r.width*.55),-1,1);rig.tPitch=clamp((e.clientY-r.top-r.height*.4)/(r.height*.55),-1,1);rig.lastPtr=performance.now()});
stage.addEventListener('pointerdown',e=>{const[x,y]=ptr(e),ix=cam.x+(x*2-1)*cam.hw,iy=cam.y+(y*2-1)*cam.hh;
  if(Math.hypot(ix-622,iy-470)<170){setMood('embarrassed',2200);rig.bump=-.05}});

addEventListener('message',e=>{if(e.origin!==location.origin)return;const d=e.data||{};if(d.type==='rin:talking')rig.talking=!!d.active;if(d.type==='rin:mood'&&MOODS[d.mood])setMood(d.mood,d.duration||2400)});
boot().then(ok=>{if(ok){$('fallback').style.visibility='hidden';}else cv.remove();requestAnimationFrame(frame)}).catch(e=>{console.error(e);cv.remove();requestAnimationFrame(frame)});
</script>
</body>
